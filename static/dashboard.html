<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reverse CAPTCHA Live</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  body.dash { background: var(--ink); color: #fff; }
  .dash-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 28px; flex-wrap: wrap; }
  .dash-head .logo { font-size: clamp(24px, 3vw, 40px); }
  .live { font: 700 14px "JetBrains Mono"; color: var(--yellow); }
  .live::before { content: "●"; color: var(--red); margin-right: 6px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .grid { display: grid; grid-template-columns: 1.25fr 1fr; grid-template-rows: auto auto; gap: 20px; padding: 0 28px 28px; }
  .panel { background: var(--paper); color: var(--ink); border: 4px solid #fff; border-radius: 22px; padding: 20px 24px; box-shadow: 8px 8px 0 var(--red); min-width: 0; }
  .panel h2 { font-family: "Archivo Black"; font-weight: 400; margin: 0 0 10px; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
  .meter-panel { grid-row: span 2; text-align: center; }
  .gauge { width: 100%; max-width: 640px; }
  #needle { transform-box: fill-box; transform-origin: 50% 100%; transition: transform 1.4s cubic-bezier(.2, 1.7, .35, 1); }
  .big-label { font-family: "Archivo Black"; font-size: clamp(36px, 5.5vw, 76px); line-height: 1; margin: 4px 0; }
  .big-label.HUMAN { color: var(--green); }
  .big-label.SCRAPER, .big-label.BROWSER, .big-label.VISION { color: var(--red); }
  .big-label.UNCERTAIN { color: #b88a00; font-size: clamp(28px, 3.6vw, 48px); }
  .sub { font: 600 18px Inter; color: var(--muted); }
  .latest-reasons { text-align: left; margin: 14px auto 0; max-width: 620px; font-size: 17px; }
  .latest-reasons li { margin: 4px 0; }
  .feed { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: hidden; }
  .feed li { display: grid; grid-template-columns: 150px 54px 1fr; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 2px dashed #0002; font-size: 15px; animation: pop .5s; }
  @keyframes pop { from { background: var(--yellow); } }
  .chip { font: 400 13px "Archivo Black"; padding: 4px 8px; border-radius: 8px; border: 2px solid var(--ink); text-align: center; color: #fff; white-space: nowrap; }
  .chip.HUMAN { background: var(--green); } .chip.SCRAPER { background: var(--red); } .chip.BROWSER { background: var(--blue); }
  .chip.VISION { background: #8a2be2; } .chip.UNCERTAIN { background: var(--yellow); color: var(--ink); }
  .score { font: 700 16px "JetBrains Mono"; text-align: right; }
  .why { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .hall { margin: 0; padding-left: 0; list-style: none; counter-reset: h; }
  .hall li { counter-increment: h; display: flex; gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 2px dashed #0002; font-size: 17px; }
  .hall li::before { content: counter(h); font-family: "Archivo Black"; width: 28px; color: var(--red); }
  .hall .nm { font-weight: 800; flex: 1; } .hall .st { font: 600 14px "JetBrains Mono"; color: var(--muted); }
  .counts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  .imp-row { display: grid; grid-template-columns: 150px 1fr 48px; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
  .imp-bar { height: 12px; background: var(--blue); border-radius: 6px; }
  .ctrl { display: flex; gap: 10px; }
  .ctrl button { font: 700 13px Inter; background: transparent; color: #fff; border: 2px solid #fff6; border-radius: 10px; padding: 6px 12px; cursor: pointer; }
  .empty { color: var(--muted); font-style: italic; }
  body.demo .panel { font-size: 1.1em; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .meter-panel { grid-row: auto; } .feed li { grid-template-columns: 120px 44px 1fr; } }
</style>
</head>
<body class="dash">
  <header class="dash-head">
    <div class="logo"><span class="rev">⟲</span> REVERSE<b>CAPTCHA</b> <span style="font-size:.5em;color:#fff">live</span></div>
    <div class="live" id="liveText">waiting for visitors…</div>
    <div class="ctrl"><button id="resetBtn" title="Archive all attempts (kept for training)">Reset</button></div>
  </header>
  <div class="grid">
    <section class="panel meter-panel">
      <h2>Latest visitor</h2>
      <svg class="gauge" viewBox="-40 0 680 345" aria-label="Human to machine meter">
        <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#18a54a"/><stop offset=".5" stop-color="#ffd400"/><stop offset="1" stop-color="#e2231a"/></linearGradient></defs>
        <path d="M40 300 A260 260 0 0 1 560 300" fill="none" stroke="#111" stroke-width="64" stroke-linecap="round"/>
        <path d="M40 300 A260 260 0 0 1 560 300" fill="none" stroke="url(#g)" stroke-width="52" stroke-linecap="round"/>
        <text x="40" y="335" font-family="Archivo Black" font-size="24" text-anchor="middle">HUMAN</text>
        <text x="560" y="335" font-family="Archivo Black" font-size="24" text-anchor="middle">MACHINE</text>
        <g id="needle" style="transform: rotate(-90deg)">
          <polygon points="292,300 308,300 300,62" fill="#111"/>
        </g>
        <circle cx="300" cy="300" r="26" fill="#111"/><text id="scoreTxt" x="300" y="308" fill="#fff" font-family="JetBrains Mono" font-weight="700" font-size="22" text-anchor="middle">–</text>
      </svg>
      <div id="bigLabel" class="big-label">–</div>
      <div id="latestSub" class="sub"></div>
      <ul id="latestReasons" class="latest-reasons"></ul>
      <div class="counts" id="counts"></div>
    </section>
    <section class="panel">
      <h2>Recent attempts</h2>
      <ul class="feed" id="feed"><li class="empty">No one yet. Go on, try it.</li></ul>
    </section>
    <section class="panel">
      <h2>🏛️ Hall of Humans</h2>
      <p class="sub" style="margin:0 0 8px;font-size:14px">Brave mammals who tried and failed, closest first</p>
      <ol class="hall" id="hall"><li class="empty">Nobody has admitted to being human yet.</li></ol>
      <div id="impWrap" class="hidden"><h2 style="margin-top:18px">What the model looks at</h2><div id="imp"></div></div>
    </section>
  </div>
  <script src="/static/dashboard.js"></script>
</body>
</html>
