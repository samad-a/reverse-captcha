<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glenhire: tech jobs in Scotland</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;500;600;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/demo.css">
<link rel="stylesheet" href="/static/glenhire.css">
</head>
<body>
  <header class="top"><div class="top-in"><a class="brand" href="/jobs">glen<span>hire</span></a><nav><span>Find jobs</span><span>Companies</span><span>Salaries</span></nav><span class="post">Post a job</span></div></header>
  <div class="searchbar"><div class="searchbar-in">
    <label for="q" class="hidden">Search jobs</label><input id="q" placeholder="Job title, skill or company">
    <input class="loc" value="Scotland" aria-label="Location" readonly>
  </div></div>
  <div class="layout">
    <aside>
      <div class="grp"><h4>Work mode</h4><div id="modes"></div></div>
      <div class="grp"><h4>Posted</h4><label><input type="radio" name="age" checked> Any time</label><label><input type="radio" name="age"> Last 3 days</label><label><input type="radio" name="age"> Last week</label></div>
    </aside>
    <main>
      <p class="count"><span id="count"></span><span>Sorted by: newest</span></p>
      <div id="list"></div>
      <div class="agent-note"><span class="rc">⟲</span><span><b>Applying with an AI assistant?</b> Agents get a job feed and an application API. Their applications are labelled as AI-assisted, with a daily cap, so mass-apply bots can't drown out real candidates.</span></div>
    </main>
  </div>
  <script src="/static/demobar.js"></script>
  <script src="/static/telemetry.js"></script>
  <script src="/static/lane.js"></script>
  <script>
  (async () => {
    const jobs = await (await fetch("/api/sites/jobs/content")).json();
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const k = (n) => `£${Math.round(n / 1000)}k`;
    const COLORS = ["#0d7c6c", "#2d5aa8", "#b4432f", "#6b4e8f", "#a7731b", "#2f6b3f"];
    const initials = (s) => s.split(/\s+/).filter((w) => /^[A-Z]/.test(w)).slice(0, 2).map((w) => w[0]).join("") || s[0];
    const modes = [...new Set(jobs.map((j) => j.mode))];
    document.getElementById("modes").innerHTML = modes.map((m) => `<label><input type="checkbox" value="${esc(m)}" checked> ${esc(m)}</label>`).join("");
    const render = () => {
      const q = document.getElementById("q").value.toLowerCase();
      const on = [...document.querySelectorAll("#modes input:checked")].map((x) => x.value);
      const shown = jobs.filter((j) => (!q || JSON.stringify(j).toLowerCase().includes(q)) && on.includes(j.mode));
      document.getElementById("count").textContent = `${shown.length} job${shown.length === 1 ? "" : "s"} in Scotland`;
      document.getElementById("list").innerHTML = shown.map((j) => `
        <div class="job" id="job-${j.id}">
          <div class="logo-sq" style="background:${COLORS[jobs.indexOf(j) % COLORS.length]}">${esc(initials(j.company))}</div>
          <div><h3>${esc(j.title)}</h3><div class="meta">${esc(j.company)}, ${esc(j.location)} (${esc(j.mode)})</div>
            <div class="tags">${j.tags.map((t) => `<span>${esc(t)}</span>`).join("")}</div></div>
          <div class="side"><div class="sal">${j.salary_gbp[0] === j.salary_gbp[1] ? k(j.salary_gbp[0]) : k(j.salary_gbp[0]) + "–" + k(j.salary_gbp[1])}</div>
            <div class="age">Posted ${jobs.indexOf(j) + 1}d ago</div>
            <button class="apply" data-id="${j.id}">Easy apply</button></div></div>`).join("");
      document.querySelectorAll(".apply").forEach((b) => b.addEventListener("click", async () => {
        const r = await RCRoute("jobs", { job: b.dataset.id });
        if (!r) return;
        const a = r.result.application;
        const card = document.getElementById("job-" + b.dataset.id);
        b.remove();
        card.insertAdjacentHTML("beforeend", `<div class="done"><b>Application started</b> for ${esc(a.job.title)} at ${esc(a.job.company)}, as a human candidate. ${esc(a.next)}</div>`);
      }));
    };
    document.getElementById("q").addEventListener("input", render);
    document.getElementById("modes").addEventListener("change", render);
    render();
  })();
  </script>
</body>
</html>
